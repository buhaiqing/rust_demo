[package]
name = "rust_demo"
version = "0.1.0"
edition = "2021"
description = "A cross-platform Hello World Tauri application"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
