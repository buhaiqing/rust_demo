name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: rust_demo-x86_64-pc-windows-msvc.zip
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: rust_demo-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: rust_demo-aarch64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: rust_demo-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: rust_demo-aarch64-unknown-linux-gnu.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache npm dependencies
        if: runner.os != 'Linux' || matrix.target != 'aarch64-unknown-linux-gnu'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            src-tauri/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('src-tauri/**/package-lock.json') }}

      - name: Install frontend dependencies
        run: |
          cd src-tauri && npm install

      - name: Build Tauri app
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build release
        run: |
          cd src-tauri && npm run tauri build -- --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            powershell -Command "Compress-Archive -Path ./* -DestinationPath ${{ matrix.artifact }}"
          else
            tar czf ${{ matrix.artifact }} ./*
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.artifact }}

  create-release:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
